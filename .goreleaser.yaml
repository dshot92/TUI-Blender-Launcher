version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tui-blender-launcher
    main: .
    binary: tui-blender-launcher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    # use zip for windows
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      tui-blender-launcher_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: dshot92
    name: TUI-Blender-Launcher
  draft: false
  prerelease: auto